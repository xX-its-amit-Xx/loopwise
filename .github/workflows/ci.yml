name: CI

# Runs on every push and pull request. The fast job (no LightGBM, no PyTorch,
# no network) is the gate; the heavier matrix runs alongside it so a missing
# optional dependency never blocks a merge but is still actually tested.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        # Network-marked tests download public datasets; they run in the
        # separate datasets job so a flaky mirror cannot fail the gate.
        run: pytest -v -m "not network" --durations=10

      - name: Import check
        run: |
          python -c "import loopwise; print(loopwise.__version__)"
          python -c "import loopwise.contrib"  # must import without lightgbm/torch

      - name: CLI smoke test
        run: |
          loopwise check
          loopwise replay synthetic --n-seeds 1 --n-rounds 2 --budget 16 \
            --n-initial 24 --policies random,greedy,bald --out /tmp/ci_out
          test -f /tmp/ci_out/replay_comparison.png

  test-optional-deps:
    name: tests with LightGBM + PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with LightGBM, PyTorch CPU, RDKit)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lightgbm,chem]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests
        run: pytest -v -m "not network" --durations=10

      - name: Confirm the optional adapters really ran
        run: |
          python - <<'PY'
          import lightgbm, torch, rdkit
          from loopwise.contrib import LightGBMAdapter, TorchEnsembleAdapter
          print("lightgbm", lightgbm.__version__, "torch", torch.__version__)
          PY

  datasets:
    name: public dataset replay (network)
    runs-on: ubuntu-latest
    continue-on-error: true  # an upstream mirror outage is not our bug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,chem]"

      - name: Replay on Tox21 and BACE
        run: pytest -v -m network --durations=5

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check loopwise tests
      - name: Format check
        run: ruff format --check --diff loopwise tests
        continue-on-error: true
