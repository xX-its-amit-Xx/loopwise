# conda environment for Loopwise, including the optional adapters and the
# chemistry toolkit the cookbook notebooks use.
#
#   conda env create -f environment.yml
#   conda activate loopwise
#   pip install -e .
#
# RDKit is the reason this file exists: it installs cleanly from conda-forge
# and is awkward from pip on some platforms. Everything else is pip-installable
# via `pip install -e ".[all]"` if you prefer a venv.
name: loopwise
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # core
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - psutil>=5.9
  # chemistry: SMILES parsing and Morgan fingerprints for the public datasets
  - rdkit>=2023.03
  # optional model adapters
  - lightgbm>=4.0
  - pytorch>=2.0
  - cpuonly            # drop this line for a CUDA build
  # notebooks
  - jupyter>=1.0
  - nbconvert>=7.0
  - ipykernel>=6.0
  # dev
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff
  - pip:
      - -e .
